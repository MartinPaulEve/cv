name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Sync dependencies
        run: uv sync

      - name: Install Node dependencies
        run: npm ci

      - name: Lint
        run: uv run ruff check cv tests

      - name: Run tests
        run: uv run pytest

      - name: Run renderer and accessibility tests
        run: npm test
